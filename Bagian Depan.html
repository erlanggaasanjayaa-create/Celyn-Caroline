<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Webtoon Indonesia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        /* Banner Logo */
        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #00DC64, #00AB4E);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0, 220, 100, 0.3);
            animation: float 3s ease-in-out infinite;
        }

        .logo svg {
            width: 70px;
            height: 70px;
            fill: white;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            color: #00DC64;
            font-size: 3em;
            margin-bottom: 15px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 40px;
        }

        /* Navigasi/Menu */
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn {
            padding: 18px 30px;
            border: none;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-decoration: none;
            color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .btn-home {
            background: linear-gradient(135deg, #00BFFF, #007ACC);
        }

        .btn-gallery {
            background: linear-gradient(135deg, #00DC64, #00AB4E);
        }

        .btn-link {
            background: linear-gradient(135deg, #4a4a4a, #2d2d2d);
        }

        .btn-form {
            background: linear-gradient(135deg, #5865F2, #4752C4);
        }

        .btn-about {
            background: linear-gradient(135deg, #FF6B6B, #EE5A52);
        }

        .btn svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        /* Footer */
        footer {
            color: #999;
            font-size: 0.9em;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Banner -->
        <div class="logo">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M19 2H5c-1.1 0-2 .9-2 2v16c0 
                1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM9 
                18H7V6h2v12zm4 0h-2V6h2v12zm4 0h-2V6h2v12z"/>
            </svg>
        </div>

        <!-- Judul -->
        <h1>Portal Webtoon</h1>
        <p class="subtitle">Indonesia's Largest Comic Community</p>

        <!-- Navigasi/Menu -->
        <div class="button-container">
            <a href="home.html" class="btn btn-home">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 
                    2 12h3v8z"/>
                </svg>
                Home
            </a>

            <a href="Galeri V2.html" class="btn btn-gallery">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22 16V4c0-1.1-.9-2-2-2H8c-1.1 0-2 .9-2 
                    2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2zm-11-4l2.03 
                    2.71L16 11l4 5H8l3-4zM2 6v14c0 1.1.9 2 2 
                    2h14v-2H4V6H2z"/>
                </svg>
                Gallery
            </a>

            <a href="https://www.webtoons.com/id/" class="btn btn-link" target="_blank">
                <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 8v40l28 8 28-8V8H4z" fill="#00DC64"/>
                    <text x="50%" y="55%" text-anchor="middle" font-size="14" font-weight="bold" fill="white" font-family="Arial, sans-serif">
                        WEBTOON
                    </text>
                </svg>
                Original Webtoon
            </a>

            <a href="Formulir V2.html" class="btn btn-form">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 
                    2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/>
                </svg>
                Form
            </a>

            <a href="Tentang Kami.html" class="btn btn-about">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 
                    10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                </svg>
                About Us
            </a>
        </div>

        <!-- Content -->
        <div class="content">
            <p>Selamat datang di Portal Webtoon Indonesia. 
            Nikmati berbagai komik, galeri, dan informasi terbaru!</p>
        </div>

        <!-- Footer -->
        <footer>
            &copy; CopyRight [Erlangga Sanjaya | 251011701265 | 01SIFP014] 
            ATP / ATM HARINYA SENIN TERUS! - 2025
        </footer>
    </div>

    <script>
        // Animasi hover untuk logo
        const logo = document.querySelector('.logo');
        logo.addEventListener('mouseenter', function() {
            this.style.transform = 'scale(1.1) rotate(5deg)';
        });
        logo.addEventListener('mouseleave', function() {
            this.style.transform = 'scale(1) rotate(0deg)';
        });

        // Log ketika tombol diklik
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', function() {
                console.log('Navigating to:', this.getAttribute('href'));
            });
        });
    </script>
</body>
</html>
